<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Nashiha ❤️</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<audio id="music" loop>
<source src="perfect.mp3" type="audio/mpeg">
</audio>

<div id="floatingContainer"></div>

<div id="exitBtn">EXIT</div>

<!-- LEAVE MODAL -->

<div id="leaveModal" class="modal">

<div class="modalContent leaveBox">

<h2>You wanna leave me? 🥺</h2>

<div class="leaveButtons">

<button id="yesBtn">Yes</button>

<button id="noBtn">No</button>

</div>

<div id="leaveText"></div>

</div>

</div>

<!-- INTRO PAGE -->

<section id="intro" class="page active">

<div class="introBox">

<h1 class="title">
For The love of my life ❤️
</h1>

<div id="introText"></div>

<button id="continueBtn">
Continue
</button>

</div>

</section>

<!-- MAIN PAGE -->

<section id="mainPage" class="page">

<h1 class="mainTitle">

A Few Things For You ❤️

</h1>

<div class="giftContainer">

<div class="gift" id="letterGift">

📩

<span>
Letter
</span>

</div>

<div class="gift" id="gameGift">

❤️

<span>
Heart Game
</span>

</div>

<div class="gift" id="galleryGift">

📸

<span>
Autism
</span>

</div>

</div>

</section>

<!-- LETTER -->

<div class="modal" id="letterModal">

<div class="modalContent">

<button class="closeBtn">
✕
</button>

<div id="letterText"></div>

</div>

</div>

<!-- GAME -->

<div class="modal" id="gameModal">

<div class="modalContent">

<button class="closeGame">
✕
</button>

<h2>

Collect Every Heart ❤️

</h2>

<p id="compliment">

Catch a heart

</p>

<div id="gameArea"></div>

</div>

</div>

<!-- REWARD IMAGE -->

<div class="modal" id="rewardModal">

<div class="modalContent">

<button class="closeReward">

✕

</button>

<img src="reward.jpg" class="rewardImage">

</div>

</div>

<!-- GALLERY -->

<div class="modal" id="galleryModal">

<div class="modalContent">

<button class="closeGallery">

✕

</button>

<div class="gallery">

<img src="photo1.jpg">

<img src="photo2.jpg">

<img src="photo3.jpg">

</div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
